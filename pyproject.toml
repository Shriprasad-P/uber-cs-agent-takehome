[project]
name = "uber-cs-agent"
version = "1.0.0"
description = "AI customer support agent for Uber with rigorous evaluation"
authors = [{name = "Hiver SDE Intern Candidate"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"

dependencies = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
